<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión · MatriX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="ingresar" data-title-suffix="Iniciar sesión">

  <header class="site-header">
    <div class="container nav">
      <a href="index.html" class="brand">
        <h1 class="brand-name" data-brand-name>MatriX</h1>
        <span class="brand-tag" data-brand-tag>Práctica de matemática</span>
      </a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="menu-principal">☰ Menú</button>
      <ul class="nav-links" id="menu-principal">
        <li><a href="index.html" data-page="inicio">Inicio</a></li>
        <li><a href="catalogo.html" data-page="catalogo">Niveles</a></li>
        <li><a href="ranking.html" data-page="ranking">Ranking</a></li>
        <li><a href="contacto.html" data-page="contacto">Contacto</a></li>
        <li><a href="login.html" data-page="login">Admin</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section>
      <div class="container">
        <div class="section-head" style="margin: 0 auto 28px; text-align:center; max-width: 480px;">
          <span class="eyebrow">Cuenta de jugador</span>
          <h2>Iniciá sesión</h2>
          <p>Para que tus puntajes cuenten en el ranking.</p>
        </div>

        <div class="form-card">
          <div class="alert alert-error" id="alerta-error" role="alert"></div>
          <form id="form-ingresar" novalidate>
            <div class="field">
              <label for="usuario">Nombre de usuario</label>
              <input type="text" id="usuario" name="usuario" placeholder="Ej: gabi_mate" autocomplete="username" />
              
            </div>
            <div class="field">
              <label for="clave">Contraseña</label>
              <input type="password" id="clave" name="clave" placeholder="Tu contraseña" autocomplete="current-password" />
              
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="btn-ingresar">Iniciar sesión</button>
          </form>
          <p style="margin-top:18px; text-align:center; font-size:0.9rem;">
            ¿Todavía no tenés cuenta? <a href="registro.html" style="color:var(--accent); font-weight:600;">Registrate</a>
          </p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span data-current-year></span> <span data-brand-name>MatriX</span></span>
      <span>Proyecto final · Ruta avanzada · Jóvenes creaTIvos</span>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script type="module">
    import { API_URL, guardarSesion } from "./js/sesion.js";

    const form = document.getElementById("form-ingresar");
    const alerta = document.getElementById("alerta-error");
    const boton = document.getElementById("btn-ingresar");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alerta.classList.remove("show", "visible");
      alerta.textContent = "";

      boton.disabled = true;
      boton.textContent = "Ingresando...";
      try {
        const respuesta = await fetch(`${API_URL}/api/ingresar`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usuario: form.usuario.value.trim(), clave: form.clave.value }),
        });
        const datos = await respuesta.json();
        if (!respuesta.ok) throw new Error(datos.error || "No se pudo iniciar sesión.");

        guardarSesion(datos);
        window.location.href = "index.html";
      } catch (error) {
        alerta.textContent = error.message.includes("fetch")
          ? "No hay conexión con el servidor. Probá de nuevo en un momento."
          : error.message;
        alerta.classList.add("show", "visible");
        boton.disabled = false;
        boton.textContent = "Iniciar sesión";
      }
    });
  </script>
</body>
</html>
