<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ranking · MatriX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="ranking" data-title-suffix="Ranking">

  <header class="site-header">
    <div class="container nav">
      <a href="index.html" class="brand">
        <h1 class="brand-name" data-brand-name>MatriX</h1>
        <span class="brand-tag" data-brand-tag>Práctica de matemática</span>
      </a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="menu-principal">☰ Menú</button>
      <ul class="nav-links" id="menu-principal">
        <li><a href="index.html" data-page="inicio">Inicio</a></li>
        <li><a href="catalogo.html" data-page="catalogo">Niveles</a></li>
        <li><a href="ranking.html" data-page="ranking">Ranking</a></li>
        <li><a href="contacto.html" data-page="contacto">Contacto</a></li>
        <li><a href="login.html" data-page="login">Admin</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section>
      <div class="container">
        <div class="section-head" style="margin: 0 auto 28px; text-align:center;">
          <span class="eyebrow">Ranking global</span>
          <h2>¿Quién va ganando?</h2>
          <p>Mejor puntaje de cada jugador, hasta 50 jugadores.</p>
        </div>

        <div style="display:flex; justify-content:center; margin-bottom:14px;">
          <select id="filtro-nivel" aria-label="Nivel" style="padding:9px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); color:var(--ink); font-family:var(--font-body);">
            <option value="general">Todos los niveles</option>
            <option value="suma">Sumas</option>
            <option value="resta">Restas</option>
            <option value="multiplicacion">Multiplicación</option>
            <option value="division">División</option>
            <option value="mixto">Desafío mixto</option>
          </select>
        </div>

        <div class="tabs" role="tablist" aria-label="Período del ranking" style="justify-content:center;">
          <button class="tab-btn active" data-periodo="diario" role="tab" aria-selected="true" type="button">Diario</button>
          <button class="tab-btn" data-periodo="semanal" role="tab" aria-selected="false" type="button">Semanal</button>
          <button class="tab-btn" data-periodo="mensual" role="tab" aria-selected="false" type="button">Mensual</button>
          <button class="tab-btn" data-periodo="historico" role="tab" aria-selected="false" type="button">Histórico</button>
        </div>

        <div style="max-width: 720px; margin: 0 auto;">
          <table class="ranking" id="tabla-ranking" style="display:none;">
            <thead>
              <tr>
                <th>#</th>
                <th>Jugador</th>
                <th>Nivel</th>
                <th>Puntaje</th>
                <th>Fecha</th>
              </tr>
            </thead>
            <tbody id="ranking-body"></tbody>
          </table>
          <p class="empty-state" id="ranking-estado">Cargando ranking...</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span data-current-year></span> <span data-brand-name>MatriX</span></span>
      <span>Proyecto final · Ruta avanzada · Jóvenes creaTIvos</span>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script type="module">
    import { API_URL } from "./js/sesion.js";
    const URL_API = API_URL;

    const NIVELES = {
      suma: "Sumas",
      resta: "Restas",
      multiplicacion: "Multiplicación",
      division: "División",
      mixto: "Desafío mixto",
      fracciones: "Fracciones",
      decimales: "Decimales",
      porcentajes: "Porcentajes",
    };

    const estado = document.getElementById("ranking-estado");
    const tabla = document.getElementById("tabla-ranking");
    const cuerpo = document.getElementById("ranking-body");

    function mostrarMensaje(texto) {
      estado.textContent = texto;
      estado.classList.remove("hidden");
      tabla.style.display = "none";
    }

    function fechaCorta(iso) {
      if (!iso) return "";
      return new Date(iso).toLocaleDateString("es-UY", { day: "2-digit", month: "2-digit", year: "numeric" });
    }

    let periodoActual = "diario";
    let nivelActual = "general";

    async function cargarRanking(periodo = periodoActual) {
      periodoActual = periodo;
      mostrarMensaje("Cargando ranking...");
      try {
        const respuesta = await fetch(`${URL_API}/api/ranking?periodo=${periodo}&nivel=${nivelActual}`);
        if (!respuesta.ok) throw new Error(`Estado ${respuesta.status}`);
        const partidas = await respuesta.json();

        if (partidas.length === 0) {
          mostrarMensaje("Todavía no hay partidas registradas.");
          return;
        }

        cuerpo.innerHTML = "";
        partidas.forEach((p, i) => {
          const fila = document.createElement("tr");
          [
            i + 1,
            p.nombre || "Anónimo",
            NIVELES[p.nivel] || p.nivel,
            p.puntaje,
            fechaCorta(p.fecha),
          ].forEach((valor) => {
            const celda = document.createElement("td");
            celda.textContent = valor;
            fila.append(celda);
          });
          cuerpo.append(fila);
        });

        estado.classList.add("hidden");
        tabla.style.display = "table";
      } catch (error) {
        console.warn("No se pudo cargar el ranking:", error);
        mostrarMensaje("No se pudo cargar el ranking. El servidor puede estar despertando; probá de nuevo en un momento.");
      }
    }

    document.querySelectorAll(".tab-btn").forEach((boton) => {
      boton.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => {
          b.classList.toggle("active", b === boton);
          b.setAttribute("aria-selected", String(b === boton));
        });
        cargarRanking(boton.dataset.periodo);
      });
    });

    document.getElementById("filtro-nivel").addEventListener("change", (e) => {
      nivelActual = e.target.value;
      cargarRanking(periodoActual);
    });

    cargarRanking("diario");
  </script>
</body>
</html>
